left_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 1.5
  kinematics_solver_attempts: 10
  position_only_ik: true
  # 开启近似IK解（核心参数）
  return_approximate_solution: false
  # 可选：设置位置/姿态误差阈值（根据需求调整）
  #position_accuracy: 0.01    # 位置误差允许1cm（单位：米）
  #orientation_accuracy: 0.05 # 姿态误差允许0.05弧度（约2.86度）

right_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.5
    # 开启近似IK解（核心参数）
  return_approximate_solution: true
  # 可选：设置位置/姿态误差阈值（根据需求调整）
  #position_accuracy: 0.01    # 位置误差允许1cm（单位：米）
  #orientation_accuracy: 0.05 # 姿态误差允许0.05弧度（约2.86度）