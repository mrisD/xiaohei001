# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    body_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    mobile_controller:
      type: diff_drive_controller/DiffDriveController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

left_arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
right_arm_controller:
  ros__parameters:
    joints:
      - jointr1
      - jointr2
      - jointr3
      - jointr4
      - jointr5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
body_controller:
  ros__parameters:
    joints:
      - base_lift_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
mobile_controller:
  ros__parameters:
    use_stamped_vel: false
    left_wheel_names: ["base_left_wheel_joint"]
    right_wheel_names: ["base_right_wheel_joint"]

    wheel_separation: 0.1615
    wheel_radius: 0.1

    
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    enable_odom_tf: true
    publish_rate: 50.0

    linear.x.has_velocity_limits: true  #humble default fase jazzy default true
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0

  